<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Agentic RAG</title>
    <link rel="stylesheet" href="css/auth.css">
    <script src="js/register.js" defer></script>
</head>
<body>
    <main class="auth-container">
        <section class="auth-card">
            <div class="auth-header">
                <h1>Create Account</h1>
                <p>Agentic RAG with Procedural Memory</p>
            </div>
            <form id="registerForm">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name" autocomplete="name" required>
                </div>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="new-password" required>
                </div>
                <button type="submit" id="registerButton" class="auth-button">Register</button>
            </form>
            <div id="message" class="message" role="alert"></div>
            <div class="auth-footer">
                <span>Already have an account?</span>
                <a href="login.html">Login</a>
            </div>
        </section>
    </main>
</body>
</html>
